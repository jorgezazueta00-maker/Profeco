# =============================================================
#  PROFECO - Sistema de Quejas
#  application.properties  (Quarkus / Jakarta EE)
#  Base de datos: PostgreSQL 15
# =============================================================

# ---- Servidor HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# ---- Base de datos PostgreSQL ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=profeco_user
quarkus.datasource.password=profeco_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/profeco_db

# Pool de conexiones (Agroal)
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# Ejecutar schema.sql al iniciar (crea tablas si no existen)
quarkus.datasource.jdbc.additional-jdbc-properties.currentSchema=public

# ---- Repositorio de evidencias ----
profeco.evidencias.directorio=./evidencias

# ---- Log ----
quarkus.log.level=INFO
quarkus.log.category."mx.gob.profeco".level=DEBUG

# ---- Perfil de pruebas (usa H2 en memoria para tests sin PostgreSQL) ----
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=profeco
%test.quarkus.datasource.password=profeco
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:profeco_test;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
